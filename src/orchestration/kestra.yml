id: culture_monitoring_system
namespace: dev

tasks:
  - id: get_repository
    type: io.kestra.plugin.git.Clone
    url: https://github.com/ian-migwi/culture-monitoring-system.git
    branch: main

  - id: ml_pipeline
    type: io.kestra.plugin.core.flow.WorkingDirectory
    workingDir: "{{ outputs.get_repository.workingDir }}"
    tasks:
      - id: install_dependencies
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - pip install -r requirements.txt

      - id: make_dataset
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - python src/data/make_dataset.py

      - id: train_model
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - python src/models/train.py

      - id: generate_drift_report
        type: io.kestra.plugin.scripts.shell.Commands
        commands:
          - python src/monitoring/drift_report.py
    
  - id: end
    type: io.kestra.plugin.core.log.Log
    message: "ML pipeline finished successfully!"
