services:
  - type: web
    name: culture-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn deployment.api.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    # You might want to set a specific region
    # region: oregon
